http_port 3128
icp_port 0
htcp_port 0
snmp_port 0
visible_hostname plugin-builder-egress
pid_filename /run/squid/squid.pid
pinger_enable off
cache_mem 16 MB

# This proxy is only a CONNECT allowlist. It does not decrypt TLS.
acl CONNECT method CONNECT
acl TLS_port port 443
acl connection_limit maxconn 64
acl allowed_destination dstdomain -n \
    github.com \
    www.github.com \
    gitlab.com \
    www.gitlab.com \
    api.nuget.org \
    globalcdn.nuget.org \
    www.nuget.org

# Reject destinations that resolve to loopback, private, link-local, metadata,
# documentation, multicast, or otherwise non-public address space.
acl blocked_ipv4 dst \
    0.0.0.0/8 \
    10.0.0.0/8 \
    100.64.0.0/10 \
    127.0.0.0/8 \
    168.63.129.16/32 \
    169.254.0.0/16 \
    172.16.0.0/12 \
    192.0.0.0/24 \
    192.0.2.0/24 \
    192.88.99.0/24 \
    192.168.0.0/16 \
    198.18.0.0/15 \
    198.51.100.0/24 \
    203.0.113.0/24 \
    224.0.0.0/4 \
    240.0.0.0/4
acl blocked_ipv6 dst \
    ::/96 \
    ::ffff:0:0/96 \
    64:ff9b::/96 \
    64:ff9b:1::/48 \
    100::/64 \
    2001:10::/28 \
    2001:db8::/32 \
    2002::/16 \
    fc00::/7 \
    fe80::/10 \
    ff00::/8

http_access deny connection_limit
http_access deny !CONNECT
http_access deny !TLS_port
# Evaluate the no-DNS hostname allowlist before any dst ACL. Otherwise Squid
# would resolve an attacker-chosen denied hostname while checking blocked IPs,
# which would leave a DNS exfiltration channel.
http_access deny !allowed_destination
http_access deny blocked_ipv4
http_access deny blocked_ipv6
http_access allow CONNECT TLS_port allowed_destination
http_access deny all

# Configure roughly 100 Mbit/s server- and client-side pools with a short
# 25 MB burst. The domain/IP policy and container limits remain the boundary.
delay_pools 1
delay_class 1 1
delay_parameters 1 12500000/25000000
delay_access 1 allow all
client_delay_pools 1
client_delay_parameters 1 12500000 25000000
client_delay_access 1 allow all

cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
cache_store_log none
logfile_rotate 0
shutdown_lifetime 1 seconds
