name: PluginBuilder Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and smoke-test final application image
        timeout-minutes: 15
        env:
          DOCKER_BUILDKIT: 1
        run: |
          set -euo pipefail
          docker build --pull=false --tag plugin-builder-runtime-ci:output-limiter \
            --build-arg VERSION=0.0.0-ci --build-arg GIT_COMMIT="$GITHUB_SHA" .
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 64m --pids-limit 32 --entrypoint /usr/bin/perl \
            plugin-builder-runtime-ci:output-limiter \
            /app/limit-output.pl 1024 256 4 5 -- /usr/bin/true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build --configuration Release

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/PluginBuilder.Tests.csproj') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser and OS dependencies (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pwsh PluginBuilder.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pwsh PluginBuilder.Tests/bin/Release/net10.0/playwright.ps1 install-deps chromium

      - name: Install gVisor runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          curl -fsSL https://gvisor.dev/archive.key |
            sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" |
            sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q '"runsc"'

      - name: Mount isolated build scratch
        run: |
          set -euo pipefail
          sudo install -m 0700 -d /mnt/pluginbuilder-build-scratch
          # Reserve both slots before mounting either. Sparse backing files would
          # let one build consume the host space promised to the other slot.
          for slot in 0 1; do
            fallocate --length 6G "$RUNNER_TEMP/pluginbuilder-build-scratch-$slot.ext4"
          done
          for slot in 0 1; do
            sudo install -m 0700 -d "/mnt/pluginbuilder-build-scratch/slot-$slot"
            sudo mkfs.ext4 -q -F -E nodiscard -N 65536 \
              "$RUNNER_TEMP/pluginbuilder-build-scratch-$slot.ext4"
            sudo mount -o loop,nosuid,nodev \
              "$RUNNER_TEMP/pluginbuilder-build-scratch-$slot.ext4" \
              "/mnt/pluginbuilder-build-scratch/slot-$slot"
            sudo chmod 0700 "/mnt/pluginbuilder-build-scratch/slot-$slot"
            mountpoint --quiet "/mnt/pluginbuilder-build-scratch/slot-$slot"
          done

      - name: Start Docker containers
        env:
          # Enable BuildKit for faster builds and better layer caching within the run
          # Note: This does NOT persist cache between GitHub Actions runs (ephemeral runners)
          # but provides ~5-10s speed improvement from BuildKit's optimized build engine
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: docker compose -f PluginBuilder.Tests/docker-compose.yml up -d --build

      - name: Build plugin-builder executor images once
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build -f PluginBuilder/PluginBuilder.Dockerfile -t plugin-builder PluginBuilder
          docker build -f PluginBuilder/PluginBuilder.Proxy.Dockerfile -t plugin-builder-proxy PluginBuilder

      - name: Run tests without a build executor
        env:
          DOCKER_STARTUP_SKIP_BUILD: "true"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet test PluginBuilder.Tests \
            --configuration Release \
            --no-build \
            --filter "Category!=ExecutorIntegration" \
            --logger "trx;LogFileName=without-executor.trx" \
            --results-directory "$RUNNER_TEMP/without-executor-test-results" \
            --verbosity normal
          grep -Eq \
            '<Counters [^>]*total="[1-9][0-9]*"' \
            "$RUNNER_TEMP/without-executor-test-results/without-executor.trx"

      - name: Run build executor and negative network canary tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo env \
            CI=true \
            HOME=/root \
            DOCKER_STARTUP_SKIP_BUILD=false \
            GITHUB_TOKEN="$GITHUB_TOKEN" \
            PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" \
            PB_BUILD_SCRATCH_ROOT=/mnt/pluginbuilder-build-scratch \
            "$(command -v dotnet)" test PluginBuilder.Tests \
              --configuration Release \
              --no-build \
              --filter "Category=ExecutorIntegration" \
              --logger "trx;LogFileName=executor-integration.trx" \
              --results-directory "$RUNNER_TEMP/executor-test-results" \
              --verbosity normal
          sudo grep -Eq \
            '<Counters [^>]*total="[1-9][0-9]*"' \
            "$RUNNER_TEMP/executor-test-results/executor-integration.trx"

      - name: Cleanup Docker
        if: always()
        run: |
          cleanup_status=0
          docker compose -f PluginBuilder.Tests/docker-compose.yml down --volumes || cleanup_status=$?
          docker ps -aq --filter 'label=BTCPAY_PLUGIN_BUILD' |
            xargs -r docker rm --force || cleanup_status=$?
          docker network ls -q --filter 'label=BTCPAY_PLUGIN_BUILD' |
            xargs -r docker network rm || cleanup_status=$?
          docker volume ls -q --filter 'label=BTCPAY_PLUGIN_BUILD' |
            xargs -r docker volume rm || cleanup_status=$?
          for slot in 0 1; do
            if mountpoint --quiet "/mnt/pluginbuilder-build-scratch/slot-$slot"; then
              sudo umount "/mnt/pluginbuilder-build-scratch/slot-$slot" || cleanup_status=$?
            fi
            if ! mountpoint --quiet "/mnt/pluginbuilder-build-scratch/slot-$slot"; then
              rm -f "$RUNNER_TEMP/pluginbuilder-build-scratch-$slot.ext4" || cleanup_status=$?
            fi
          done
          exit "$cleanup_status"
