name: PluginBuilder Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build --configuration Release

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/PluginBuilder.Tests.csproj') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright CLI + browsers (full install)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          dotnet tool install --global Microsoft.Playwright.CLI
          export PATH="$PATH:$HOME/.dotnet/tools"
          playwright install --with-deps

      - name: Install Playwright CLI only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          dotnet tool install --global Microsoft.Playwright.CLI
          export PATH="$PATH:$HOME/.dotnet/tools"

      - name: Start Docker containers
        run: docker compose -f PluginBuilder.Tests/docker-compose.yml up -d

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build plugin-builder image once
        uses: docker/build-push-action@v7
        with:
          context: PluginBuilder
          file: PluginBuilder/PluginBuilder.Dockerfile
          tags: plugin-builder
          load: true
          push: false
          cache-from: type=gha,scope=plugin-builder
          cache-to: type=gha,mode=max,scope=plugin-builder

      - name: Run tests
        env:
          DOCKER_STARTUP_SKIP_BUILD: "true"
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet test PluginBuilder.Tests --configuration Release --no-build --verbosity normal

      - name: Cleanup Docker
        if: always()
        run: docker compose -f PluginBuilder.Tests/docker-compose.yml down --volumes
